name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features
      - name: Release build
        run: cargo build --workspace --release
      - name: Package unsigned release artifact
        run: scripts/package-release.sh --output-dir dist
      - name: Root help
        run: ./target/release/airborne --help
      - name: Command help
        run: |
          ./target/release/airborne watch --help
          ./target/release/airborne rule --help
          ./target/release/airborne refresh --help
          ./target/release/airborne run --help
          ./target/release/airborne status --help
          ./target/release/airborne alerts --help
          ./target/release/airborne auth --help
          ./target/release/airborne config --help
          ./target/release/airborne doctor --help
          ./target/release/airborne migrate --help
      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@v4
        with:
          name: airborne-unsigned-macos-arm64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
